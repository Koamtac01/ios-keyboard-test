```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>iOS Keyboard / Suggestion Test</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 16px;
            margin: 0;
        }

        h2 {
            margin-top: 0;
        }

        .editor {
            width: 100%;
            box-sizing: border-box;

            font-size: 22px;
            padding: 12px;

            border: 4px solid gray;
            border-radius: 8px;

            background-color: white;
        }

        .editor:focus {
            border-color: blue;
            background-color: #e8f0ff;
            outline: none;
        }

        button {
            display: block;

            width: 100%;
            box-sizing: border-box;

            margin-top: 10px;
            padding: 12px;

            font-size: 17px;
        }

        select {
            width: 100%;
            box-sizing: border-box;

            padding: 10px;
            margin-top: 6px;

            font-size: 17px;
        }

        .section {
            margin-top: 22px;
            padding-top: 14px;

            border-top: 1px solid #ccc;
        }

        .label {
            margin-top: 10px;
            font-weight: bold;
        }

        #status {
            margin-top: 16px;
            padding: 12px;

            border: 2px solid black;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;
        }

        #attributes {
            margin-top: 10px;
            padding: 10px;

            background-color: #f5f5f5;

            border: 1px solid #aaa;
            border-radius: 8px;

            font-family: monospace;
            font-size: 13px;
        }

        #log {
            margin-top: 16px;

            height: 380px;
            overflow-y: auto;

            padding: 10px;

            background-color: #f5f5f5;

            border: 1px solid #888;
            border-radius: 8px;

            font-family: monospace;
            font-size: 13px;

            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

<h2>iOS Keyboard / Suggestion Test</h2>


<input id="editor"
       class="editor"
       type="text"
       placeholder="Tap here">


<div id="status">
    Focused: false
</div>


<div id="attributes"></div>


<div class="section">

    <div class="label">
        autocomplete
    </div>

    <select id="autocompleteSelect"
            onchange="applySettings()">

        <option value="on">
            on
        </option>

        <option value="off">
            off
        </option>

        <option value="name">
            name
        </option>

        <option value="email">
            email
        </option>

        <option value="username">
            username
        </option>

        <option value="one-time-code">
            one-time-code
        </option>

    </select>


    <div class="label">
        autocorrect
    </div>

    <select id="autocorrectSelect"
            onchange="applySettings()">

        <option value="on">
            on
        </option>

        <option value="off">
            off
        </option>

    </select>


    <div class="label">
        spellcheck
    </div>

    <select id="spellcheckSelect"
            onchange="applySettings()">

        <option value="true">
            true
        </option>

        <option value="false">
            false
        </option>

    </select>


    <div class="label">
        inputmode
    </div>

    <select id="inputmodeSelect"
            onchange="applySettings()">

        <option value="text">
            text
        </option>

        <option value="none">
            none
        </option>

        <option value="numeric">
            numeric
        </option>

        <option value="decimal">
            decimal
        </option>

        <option value="tel">
            tel
        </option>

        <option value="email">
            email
        </option>

        <option value="url">
            url
        </option>

    </select>

</div>


<div class="section">

    <button onclick="focusDirect()">
        1. Focus Directly
    </button>

    <button onclick="focusDelayed()">
        2. Focus After 1 Second
    </button>

    <button onclick="blurEditor()">
        3. Blur Editor
    </button>

</div>


<div class="section">

    <button onclick="simulateBarcode()">
        4. Simulate Barcode Input
    </button>

    <button onclick="barcodeBlurFocus()">
        5. Barcode → Blur → Focus After 1 Sec
    </button>

    <button onclick="recreateEditorAndFocus()">
        6. Recreate Editor → Focus
    </button>

</div>


<div class="section">

    <button onclick="setInputModeNoneThenText()">
        7. inputmode=none → text → Focus
    </button>

    <button onclick="toggleReadOnlyAndFocus()">
        8. readonly ON/OFF → Focus
    </button>

    <button onclick="checkFocus()">
        9. Check Focus
    </button>

    <button onclick="readOnlyFalseThenDelayedFocus()"> 
        10. readonly=false → Focus After 500ms 
    </button>

    <button onclick="clearLog()">
        Clear Log
    </button>

</div>


<div id="log"></div>


<script>

let editor =
    document.getElementById("editor");

const statusView =
    document.getElementById("status");

const logView =
    document.getElementById("log");

const attributesView =
    document.getElementById("attributes");


function getTime() {

    const now =
        new Date();

    return now.toLocaleTimeString()
        + "."
        + String(now.getMilliseconds()).padStart(3, "0");
}


function log(message) {

    const line =
        "[" + getTime() + "] "
        + message;

    console.log(line);

    logView.textContent +=
        line + "\n";

    logView.scrollTop =
        logView.scrollHeight;
}


function getElementName(element) {

    if (!element) {
        return "null";
    }

    let name =
        element.tagName || "UNKNOWN";

    if (element.id) {
        name += "#" + element.id;
    }

    return name;
}


function getActiveElementName() {

    return getElementName(
        document.activeElement
    );
}


function updateStatus() {

    const focused =
        document.activeElement === editor;

    statusView.textContent =
        "Focused: "
        + focused
        + " | Active: "
        + getActiveElementName();

    statusView.style.backgroundColor =
        focused
            ? "#d8ffd8"
            : "#ffd8d8";


    attributesView.textContent =
        "autocomplete = "
        + editor.getAttribute("autocomplete")
        + "\n"
        + "autocorrect = "
        + editor.getAttribute("autocorrect")
        + "\n"
        + "spellcheck = "
        + editor.spellcheck
        + "\n"
        + "inputmode = "
        + editor.getAttribute("inputmode")
        + "\n"
        + "readonly = "
        + editor.readOnly
        + "\n"
        + "disabled = "
        + editor.disabled
        + "\n"
        + "value = "
        + editor.value;
}


function attachEvents() {

    editor.addEventListener(
        "pointerdown",
        function () {

            log("EDITOR POINTER DOWN");

            log(
                "before pointer focus = "
                + (document.activeElement === editor)
            );
        }
    );


    editor.addEventListener(
        "touchstart",
        function () {

            log("EDITOR TOUCH START");
        }
    );


    editor.addEventListener(
        "click",
        function () {

            log("EDITOR CLICK");

            log(
                "click focused = "
                + (document.activeElement === editor)
            );

            log(
                "click activeElement = "
                + getActiveElementName()
            );

            updateStatus();
        }
    );


    editor.addEventListener(
        "focus",
        function () {

            log("EDITOR FOCUS");

            log(
                "focus activeElement = "
                + getActiveElementName()
            );

            updateStatus();
        }
    );


    editor.addEventListener(
        "blur",
        function () {

            log("EDITOR BLUR");

            setTimeout(
                function () {

                    log(
                        "after blur activeElement = "
                        + getActiveElementName()
                    );

                    updateStatus();

                },
                0
            );
        }
    );


    editor.addEventListener(
        "input",
        function () {

            log(
                "EDITOR INPUT : "
                + editor.value
            );

            log(
                "input focused = "
                + (document.activeElement === editor)
            );

            updateStatus();
        }
    );


    editor.addEventListener(
        "change",
        function () {

            log(
                "EDITOR CHANGE : "
                + editor.value
            );
        }
    );
}


document.addEventListener(
    "focusin",
    function (event) {

        log(
            "DOCUMENT FOCUS IN : "
            + getElementName(event.target)
        );
    }
);


document.addEventListener(
    "focusout",
    function (event) {

        log(
            "DOCUMENT FOCUS OUT : "
            + getElementName(event.target)
        );
    }
);


function applySettings() {

    const autocomplete =
        document.getElementById(
            "autocompleteSelect"
        ).value;

    const autocorrect =
        document.getElementById(
            "autocorrectSelect"
        ).value;

    const spellcheck =
        document.getElementById(
            "spellcheckSelect"
        ).value;

    const inputmode =
        document.getElementById(
            "inputmodeSelect"
        ).value;


    editor.setAttribute(
        "autocomplete",
        autocomplete
    );

    editor.setAttribute(
        "autocorrect",
        autocorrect
    );

    editor.spellcheck =
        spellcheck === "true";

    editor.setAttribute(
        "inputmode",
        inputmode
    );


    log("Settings changed");

    updateStatus();
}


function focusDirect() {

    log("");
    log("===== Focus Directly =====");

    editor.focus();

    log(
        "focused = "
        + (document.activeElement === editor)
    );

    updateStatus();
}


function focusDelayed() {

    log("");
    log("===== Focus After 1 Second =====");

    setTimeout(
        function () {

            log("Calling editor.focus()");

            editor.focus();

            log(
                "immediately focused = "
                + (document.activeElement === editor)
            );

            updateStatus();


            setTimeout(
                function () {

                    log(
                        "500ms focused = "
                        + (document.activeElement === editor)
                    );

                    updateStatus();

                },
                500
            );

        },
        1000
    );
}


function blurEditor() {

    log("");
    log("===== Blur =====");

    editor.blur();

    updateStatus();
}


function simulateBarcode() {

    log("");
    log("===== Simulate Barcode =====");


    editor.value =
        "ABC123456789";


    editor.dispatchEvent(
        new Event(
            "input",
            {
                bubbles: true
            }
        )
    );


    log("Barcode simulated");

    updateStatus();
}


function barcodeBlurFocus() {

    log("");
    log("===== Barcode → Blur → Focus =====");


    editor.value =
        "ABC123456789";


    editor.dispatchEvent(
        new Event(
            "input",
            {
                bubbles: true
            }
        )
    );


    editor.blur();

    log("Editor blurred");


    setTimeout(
        function () {

            log("Calling focus after 1 sec");

            editor.focus();

            log(
                "focused = "
                + (document.activeElement === editor)
            );

            updateStatus();

        },
        1000
    );
}


function recreateEditorAndFocus() {

    log("");
    log("===== Recreate Editor → Focus =====");


    const oldValue =
        editor.value;


    editor.remove();


    const newEditor =
        document.createElement("input");


    newEditor.id =
        "editor";

    newEditor.className =
        "editor";

    newEditor.type =
        "text";

    newEditor.value =
        oldValue;

    newEditor.placeholder =
        "NEW editor - tap here";


    document.body.insertBefore(
        newEditor,
        statusView
    );


    editor =
        newEditor;


    attachEvents();

    applySettings();


    log("New editor created");


    setTimeout(
        function () {

            log("Calling focus on NEW editor");

            editor.focus();

            log(
                "focused = "
                + (document.activeElement === editor)
            );

            updateStatus();

        },
        500
    );
}


function setInputModeNoneThenText() {

    log("");
    log("===== inputmode none → text =====");


    editor.setAttribute(
        "inputmode",
        "none"
    );


    log("inputmode = none");


    editor.focus();


    setTimeout(
        function () {

            editor.setAttribute(
                "inputmode",
                "text"
            );


            log("inputmode = text");


            editor.focus();


            log(
                "focused = "
                + (document.activeElement === editor)
            );


            updateStatus();

        },
        500
    );
}


function toggleReadOnlyAndFocus() {

    log("");
    log("===== readonly toggle =====");


    editor.readOnly = true;

    log("readonly = true");


    editor.focus();


    setTimeout(
        function () {

            editor.readOnly = false;

            log("readonly = false");


            editor.focus();


            log(
                "focused = "
                + (document.activeElement === editor)
            );


            updateStatus();

        },
        500
    );
}


function checkFocus() {

    log("");
    log("===== Check Focus =====");

    log(
        "focused = "
        + (document.activeElement === editor)
    );

    log(
        "activeElement = "
        + getActiveElementName()
    );

    log(
        "readonly = "
        + editor.readOnly
    );

    log(
        "disabled = "
        + editor.disabled
    );

    log(
        "inputmode = "
        + editor.getAttribute("inputmode")
    );

    updateStatus();
}


function clearLog() {

    logView.textContent =
        "";

    log("Log cleared");

    updateStatus();
}

function readOnlyFalseThenDelayedFocus() {

    log("");
    log("===== readonly=false → Focus After 500ms =====");

    editor.readOnly = false;


    log("readonly = false");

    updateStatus();


    setTimeout(
        function () {

            log("500ms later -> editor.focus()");

            editor.focus();

            log(
                "immediately focused = "
                + (document.activeElement === editor)
            );

            log(
                "activeElement = "
                + getActiveElementName()
            );

            updateStatus();


            setTimeout(
                function () {

                    log(
                        "100ms later focused = "
                        + (document.activeElement === editor)
                    );

                    log(
                        "100ms activeElement = "
                        + getActiveElementName()
                    );

                    updateStatus();

                },
                100
            );

        },
        500
    );
}

attachEvents();


window.addEventListener(
    "load",
    function () {

        applySettings();

        log("Page loaded");

        log(
            "User Agent = "
            + navigator.userAgent
        );

        updateStatus();
    }
);

</script>

</body>
</html>
