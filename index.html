```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>iOS Editor / Keyboard Test</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 16px;
            margin: 0;
        }

        h2 {
            margin-top: 0;
        }

        #editorContainer {
            margin-bottom: 16px;
        }

        .editor {
            width: 100%;
            box-sizing: border-box;

            font-size: 22px;
            padding: 12px;

            border: 4px solid gray;
            border-radius: 8px;

            background-color: white;
        }

        .editor:focus {
            border-color: blue;
            background-color: #e8f0ff;
            outline: none;
        }

        button {
            display: block;

            width: 100%;
            box-sizing: border-box;

            margin-top: 10px;
            padding: 12px;

            font-size: 17px;
        }

        .section {
            margin-top: 22px;
            padding-top: 12px;
            border-top: 1px solid #ccc;
        }

        #status {
            margin-top: 16px;
            padding: 12px;

            border: 2px solid black;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;
        }

        #log {
            margin-top: 16px;

            height: 360px;
            overflow-y: auto;

            padding: 10px;

            background-color: #f5f5f5;

            border: 1px solid #888;
            border-radius: 8px;

            font-family: monospace;
            font-size: 13px;

            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

<h2>iOS Editor / Custom Keyboard Test</h2>


<div id="editorContainer">

    <input id="editor"
           class="editor"
           type="text"
           autocomplete="off"
           placeholder="Tap here">

</div>


<div id="status">
    Focused: false
</div>


<div class="section">

    <button onclick="focusDirect()">
        1. Focus Directly
    </button>

    <button onclick="focusDelayed()">
        2. Focus After 1 Second
    </button>

    <button onclick="blurEditor()">
        3. Blur Editor
    </button>

</div>


<div class="section">

    <button onclick="simulateBarcodeInput()">
        4. Simulate Barcode Input
    </button>

    <button onclick="simulateBarcodeThenDelayedFocus()">
        5. Barcode → Blur → Focus After 1 Sec
    </button>

    <button onclick="simulateBarcodeThenRecreateEditor()">
        6. Barcode → Recreate Editor → Focus
    </button>

</div>


<div class="section">

    <button onclick="recreateEditorOnly()">
        7. Recreate Editor Only
    </button>

    <button onclick="checkFocus()">
        8. Check Focus
    </button>

    <button onclick="clearLog()">
        Clear Log
    </button>

</div>


<div id="log"></div>


<script>

let editor =
    document.getElementById("editor");

const editorContainer =
    document.getElementById("editorContainer");

const statusView =
    document.getElementById("status");

const logView =
    document.getElementById("log");


/* --------------------------------------------------
 * Logging
 * -------------------------------------------------- */

function getTime() {

    const now =
        new Date();

    return now.toLocaleTimeString()
        + "."
        + String(now.getMilliseconds()).padStart(3, "0");
}


function log(message) {

    const line =
        "[" + getTime() + "] "
        + message;

    console.log(line);

    logView.textContent +=
        line + "\n";

    logView.scrollTop =
        logView.scrollHeight;
}


/* --------------------------------------------------
 * Element information
 * -------------------------------------------------- */

function getElementName(element) {

    if (!element) {
        return "null";
    }

    let name =
        element.tagName || "UNKNOWN";

    if (element.id) {
        name += "#" + element.id;
    }

    return name;
}


function getActiveElementName() {

    return getElementName(
        document.activeElement
    );
}


/* --------------------------------------------------
 * Focus status
 * -------------------------------------------------- */

function updateFocusStatus() {

    const focused =
        document.activeElement === editor;

    statusView.textContent =
        "Focused: "
        + focused
        + " | Active: "
        + getActiveElementName();

    if (focused) {

        statusView.style.backgroundColor =
            "#d8ffd8";

    } else {

        statusView.style.backgroundColor =
            "#ffd8d8";
    }

    return focused;
}


/* --------------------------------------------------
 * Attach events to current editor
 * -------------------------------------------------- */

function attachEditorEvents() {

    log(
        "Attach events to "
        + getElementName(editor)
    );


    editor.addEventListener(
        "pointerdown",
        function () {

            log("EDITOR POINTER DOWN");

            log(
                "Before focus activeElement = "
                + getActiveElementName()
            );
        }
    );


    editor.addEventListener(
        "touchstart",
        function () {

            log("EDITOR TOUCH START");
        }
    );


    editor.addEventListener(
        "click",
        function () {

            log("EDITOR CLICK");

            log(
                "CLICK focused = "
                + (document.activeElement === editor)
            );

            log(
                "CLICK activeElement = "
                + getActiveElementName()
            );

            updateFocusStatus();
        }
    );


    editor.addEventListener(
        "focus",
        function () {

            log("EDITOR FOCUS");

            log(
                "FOCUS activeElement = "
                + getActiveElementName()
            );

            updateFocusStatus();
        }
    );


    editor.addEventListener(
        "blur",
        function () {

            log("EDITOR BLUR");

            setTimeout(
                function () {

                    log(
                        "After BLUR activeElement = "
                        + getActiveElementName()
                    );

                    updateFocusStatus();

                },
                0
            );
        }
    );


    editor.addEventListener(
        "input",
        function () {

            log(
                "EDITOR INPUT value = "
                + editor.value
            );

            log(
                "INPUT focused = "
                + (document.activeElement === editor)
            );

            updateFocusStatus();
        }
    );


    editor.addEventListener(
        "change",
        function () {

            log(
                "EDITOR CHANGE value = "
                + editor.value
            );
        }
    );
}


/* --------------------------------------------------
 * Document level events
 * -------------------------------------------------- */

document.addEventListener(
    "focusin",
    function (event) {

        log(
            "DOCUMENT FOCUS IN : "
            + getElementName(event.target)
        );
    }
);


document.addEventListener(
    "focusout",
    function (event) {

        log(
            "DOCUMENT FOCUS OUT : "
            + getElementName(event.target)
        );
    }
);


document.addEventListener(
    "pointerdown",
    function (event) {

        log(
            "DOCUMENT POINTER DOWN : "
            + getElementName(event.target)
        );
    }
);


/* --------------------------------------------------
 * Test 1
 *
 * User button event -> immediate focus
 * -------------------------------------------------- */

function focusDirect() {

    log("");
    log("===== TEST 1 : Focus Directly =====");

    editor.focus();

    log(
        "Immediately focused = "
        + (document.activeElement === editor)
    );

    log(
        "activeElement = "
        + getActiveElementName()
    );

    updateFocusStatus();


    setTimeout(
        function () {

            log(
                "100ms focused = "
                + (document.activeElement === editor)
            );

            log(
                "100ms activeElement = "
                + getActiveElementName()
            );

            updateFocusStatus();

        },
        100
    );
}


/* --------------------------------------------------
 * Test 2
 *
 * User button
 * -> wait 1 sec
 * -> focus()
 *
 * This is the important iOS programmatic focus test.
 * -------------------------------------------------- */

function focusDelayed() {

    log("");
    log("===== TEST 2 : Focus After 1 Second =====");

    log("Waiting 1 second...");


    setTimeout(
        function () {

            log("Calling editor.focus()");

            editor.focus();


            log(
                "Immediately focused = "
                + (document.activeElement === editor)
            );

            log(
                "activeElement = "
                + getActiveElementName()
            );

            updateFocusStatus();


            setTimeout(
                function () {

                    log(
                        "100ms focused = "
                        + (document.activeElement === editor)
                    );

                    log(
                        "100ms activeElement = "
                        + getActiveElementName()
                    );

                    updateFocusStatus();

                },
                100
            );


            setTimeout(
                function () {

                    log(
                        "500ms focused = "
                        + (document.activeElement === editor)
                    );

                    log(
                        "500ms activeElement = "
                        + getActiveElementName()
                    );

                    updateFocusStatus();

                },
                500
            );

        },
        1000
    );
}


/* --------------------------------------------------
 * Test 3
 * -------------------------------------------------- */

function blurEditor() {

    log("");
    log("===== TEST 3 : Blur =====");

    editor.blur();

    log(
        "After blur activeElement = "
        + getActiveElementName()
    );

    updateFocusStatus();
}


/* --------------------------------------------------
 * Test 4
 *
 * Approximate textDocumentProxy.insertText()
 *
 * JavaScript cannot actually invoke
 * textDocumentProxy.
 *
 * This manually changes value and fires
 * an input event so we can test web-side behavior.
 * -------------------------------------------------- */

function simulateBarcodeInput() {

    log("");
    log("===== TEST 4 : Simulate Barcode =====");


    editor.value =
        "123456789";


    const event =
        new Event(
            "input",
            {
                bubbles: true
            }
        );


    editor.dispatchEvent(event);


    log("Barcode simulation finished");

    log(
        "focused = "
        + (document.activeElement === editor)
    );

    updateFocusStatus();
}


/* --------------------------------------------------
 * Test 5
 *
 * Similar to:
 *
 * scanner input
 * -> application processing
 * -> blur
 * -> async callback
 * -> editor.focus()
 *
 * -------------------------------------------------- */

function simulateBarcodeThenDelayedFocus() {

    log("");
    log("===== TEST 5 =====");
    log("Barcode -> Blur -> Delayed Focus");


    editor.value =
        "123456789";


    editor.dispatchEvent(
        new Event(
            "input",
            {
                bubbles: true
            }
        )
    );


    log("Barcode input finished");


    editor.blur();

    log("Editor blurred");


    setTimeout(
        function () {

            log(
                "1 second later -> editor.focus()"
            );


            editor.focus();


            log(
                "Immediately focused = "
                + (document.activeElement === editor)
            );

            log(
                "activeElement = "
                + getActiveElementName()
            );

            updateFocusStatus();


            setTimeout(
                function () {

                    log(
                        "500ms later focused = "
                        + (document.activeElement === editor)
                    );

                    log(
                        "500ms activeElement = "
                        + getActiveElementName()
                    );

                    updateFocusStatus();

                },
                500
            );

        },
        1000
    );
}


/* --------------------------------------------------
 * Test 6
 *
 * Important React/Vue style test.
 *
 * barcode
 * -> blur
 * -> DOM editor destroyed
 * -> new editor created
 * -> programmatic focus
 *
 * -------------------------------------------------- */

function simulateBarcodeThenRecreateEditor() {

    log("");
    log("===== TEST 6 =====");
    log(
        "Barcode -> Blur -> Recreate Editor -> Focus"
    );


    editor.value =
        "123456789";


    editor.dispatchEvent(
        new Event(
            "input",
            {
                bubbles: true
            }
        )
    );


    editor.blur();

    log("Old editor blurred");


    setTimeout(
        function () {

            recreateEditor();


            log(
                "New editor created"
            );


            setTimeout(
                function () {

                    log(
                        "Calling focus() on NEW editor"
                    );


                    editor.focus();


                    log(
                        "Immediately focused = "
                        + (document.activeElement === editor)
                    );

                    log(
                        "activeElement = "
                        + getActiveElementName()
                    );

                    updateFocusStatus();


                    setTimeout(
                        function () {

                            log(
                                "500ms later focused = "
                                + (document.activeElement === editor)
                            );

                            log(
                                "500ms activeElement = "
                                + getActiveElementName()
                            );

                            updateFocusStatus();

                        },
                        500
                    );

                },
                200
            );

        },
        500
    );
}


/* --------------------------------------------------
 * Test 7
 * -------------------------------------------------- */

function recreateEditorOnly() {

    log("");
    log("===== TEST 7 : Recreate Editor =====");

    recreateEditor();

    updateFocusStatus();
}


/* --------------------------------------------------
 * Recreate actual DOM INPUT node
 * -------------------------------------------------- */

function recreateEditor() {

    const oldValue =
        editor.value;


    log(
        "Removing old editor : "
        + getElementName(editor)
    );


    editor.remove();


    const newEditor =
        document.createElement("input");


    newEditor.id =
        "editor";


    newEditor.className =
        "editor";


    newEditor.type =
        "text";


    newEditor.autocomplete =
        "off";


    newEditor.placeholder =
        "NEW editor - tap here";


    newEditor.value =
        oldValue;


    editorContainer.appendChild(
        newEditor
    );


    editor =
        newEditor;


    attachEditorEvents();


    log(
        "Created new editor : "
        + getElementName(editor)
    );
}


/* --------------------------------------------------
 * Check current state
 * -------------------------------------------------- */

function checkFocus() {

    log("");
    log("===== CHECK FOCUS =====");


    log(
        "editor = "
        + getElementName(editor)
    );


    log(
        "Focused = "
        + (document.activeElement === editor)
    );


    log(
        "activeElement = "
        + getActiveElementName()
    );


    log(
        "editor.isConnected = "
        + editor.isConnected
    );


    log(
        "editor.disabled = "
        + editor.disabled
    );


    log(
        "editor.readOnly = "
        + editor.readOnly
    );


    updateFocusStatus();
}


/* --------------------------------------------------
 * Clear
 * -------------------------------------------------- */

function clearLog() {

    logView.textContent =
        "";

    log("Log cleared");

    updateFocusStatus();
}


/* --------------------------------------------------
 * Startup
 * -------------------------------------------------- */

attachEditorEvents();


window.addEventListener(
    "load",
    function () {

        log("Page loaded");

        log(
            "User Agent = "
            + navigator.userAgent
        );

        log(
            "Initial activeElement = "
            + getActiveElementName()
        );

        updateFocusStatus();
    }
);

</script>

</body>
</html>
