<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>iOS Keyboard Focus Test</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            margin: 0;
        }

        h2 {
            margin-bottom: 20px;
        }

        #editor {
            width: 90%;
            font-size: 24px;
            padding: 12px;

            border: 4px solid gray;
            border-radius: 8px;

            background-color: white;

            box-sizing: border-box;
        }

        /*
         * Focus가 실제로 잡히면
         * 파란색으로 확실하게 표시
         */
        #editor:focus {
            border: 5px solid blue;
            background-color: #e8f0ff;
            outline: none;
        }

        button {
            display: block;

            width: 100%;
            max-width: 400px;

            font-size: 18px;

            padding: 12px;
            margin-top: 12px;
        }

        #status {
            margin-top: 20px;

            padding: 12px;

            border: 2px solid black;
            border-radius: 8px;

            font-size: 18px;
            font-weight: bold;
        }

        #log {
            margin-top: 20px;

            padding: 12px;

            height: 300px;

            overflow-y: auto;

            background-color: #f5f5f5;

            border: 1px solid #999;
            border-radius: 8px;

            font-family: monospace;
            font-size: 14px;

            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

<h2>iOS Keyboard / Focus Test</h2>

<input
        id="editor"
        type="text"
        placeholder="Tap here or use buttons">

<button onclick="focusDirect()">
    Focus Directly
</button>

<button onclick="focusDelayed()">
    Focus After 1 Second
</button>

<button onclick="blurEditor()">
    Blur Editor
</button>

<button onclick="checkFocus()">
    Check Focus
</button>

<button onclick="clearLog()">
    Clear Log
</button>


<div id="status">
    Focused: false
</div>


<div id="log"></div>


<script>

    const editor = document.getElementById("editor");
    const logView = document.getElementById("log");
    const statusView = document.getElementById("status");


    /*
     * 현재 시간 표시
     */
    function getTime() {
        const now = new Date();

        return now.toLocaleTimeString()
            + "."
            + String(now.getMilliseconds()).padStart(3, "0");
    }


    /*
     * 화면에 로그 출력
     */
    function log(message) {

        const text =
            "[" + getTime() + "] "
            + message;

        console.log(text);

        logView.textContent += text + "\n";

        /*
         * 항상 최신 로그가 보이도록
         */
        logView.scrollTop =
            logView.scrollHeight;
    }


    /*
     * 현재 실제 focus 상태 확인
     */
    function updateFocusStatus() {

        const focused =
            document.activeElement === editor;

        statusView.textContent =
            "Focused: " + focused;

        if (focused) {
            statusView.style.backgroundColor =
                "#d8ffd8";
        } else {
            statusView.style.backgroundColor =
                "#ffd8d8";
        }

        return focused;
    }


    /*
     * focus event
     */
    editor.addEventListener(
        "focus",
        function () {

            log("EDITOR FOCUS");

            log(
                "activeElement === editor : "
                + (document.activeElement === editor)
            );

            updateFocusStatus();
        }
    );


    /*
     * blur event
     */
    editor.addEventListener(
        "blur",
        function () {

            log("EDITOR BLUR");

            log(
                "activeElement : "
                + getActiveElementName()
            );

            updateFocusStatus();
        }
    );


    /*
     * click event
     */
    editor.addEventListener(
        "click",
        function () {

            log("EDITOR CLICK");

            log(
                "activeElement === editor : "
                + (document.activeElement === editor)
            );

            updateFocusStatus();
        }
    );


    /*
     * touch event
     */
    editor.addEventListener(
        "touchstart",
        function () {

            log("EDITOR TOUCH START");
        }
    );


    /*
     * input event
     */
    editor.addEventListener(
        "input",
        function () {

            log(
                "EDITOR INPUT : "
                + editor.value
            );

            updateFocusStatus();
        }
    );


    /*
     * change event
     */
    editor.addEventListener(
        "change",
        function () {

            log(
                "EDITOR CHANGE : "
                + editor.value
            );
        }
    );


    /*
     * document 전체의 focus 변화도 확인
     */
    document.addEventListener(
        "focusin",
        function (event) {

            log(
                "DOCUMENT FOCUS IN : "
                + getElementName(event.target)
            );
        }
    );


    document.addEventListener(
        "focusout",
        function (event) {

            log(
                "DOCUMENT FOCUS OUT : "
                + getElementName(event.target)
            );
        }
    );


    /*
     * 사용자가 버튼을 누른 즉시 focus()
     *
     * user gesture 안에서 호출
     */
    function focusDirect() {

        log("----- Focus Directly -----");

        log("editor.focus() called");

        editor.focus();

        const focused =
            document.activeElement === editor;

        log(
            "Immediately focused : "
            + focused
        );

        updateFocusStatus();


        /*
         * 잠시 후에도 focus가 유지되는지 확인
         */
        setTimeout(
            function () {

                log(
                    "100ms later focused : "
                    + (document.activeElement === editor)
                );

                log(
                    "100ms activeElement : "
                    + getActiveElementName()
                );

                updateFocusStatus();

            },
            100
        );
    }


    /*
     * 버튼 클릭 후 1초 뒤 focus()
     *
     * iOS에서 중요한 테스트
     *
     * user gesture와 focus 호출 사이에
     * asynchronous delay가 존재함
     */
    function focusDelayed() {

        log("----- Focus After 1 Second -----");

        log("Waiting 1 second...");


        setTimeout(
            function () {

                log("editor.focus() called");

                editor.focus();


                log(
                    "Immediately focused : "
                    + (document.activeElement === editor)
                );

                log(
                    "activeElement : "
                    + getActiveElementName()
                );

                updateFocusStatus();


                /*
                 * 100ms 이후에도 확인
                 */
                setTimeout(
                    function () {

                        log(
                            "100ms later focused : "
                            + (document.activeElement === editor)
                        );

                        log(
                            "100ms activeElement : "
                            + getActiveElementName()
                        );

                        updateFocusStatus();

                    },
                    100
                );


                /*
                 * 500ms 이후에도 확인
                 */
                setTimeout(
                    function () {

                        log(
                            "500ms later focused : "
                            + (document.activeElement === editor)
                        );

                        log(
                            "500ms activeElement : "
                            + getActiveElementName()
                        );

                        updateFocusStatus();

                    },
                    500
                );

            },
            1000
        );
    }


    /*
     * 강제로 focus 해제
     */
    function blurEditor() {

        log("----- Blur Editor -----");

        editor.blur();

        log(
            "After blur focused : "
            + (document.activeElement === editor)
        );

        log(
            "activeElement : "
            + getActiveElementName()
        );

        updateFocusStatus();
    }


    /*
     * 현재 focus 상태만 확인
     */
    function checkFocus() {

        log("----- Check Focus -----");

        log(
            "Focused : "
            + (document.activeElement === editor)
        );

        log(
            "activeElement : "
            + getActiveElementName()
        );

        updateFocusStatus();
    }


    /*
     * 현재 activeElement 표시용
     */
    function getActiveElementName() {

        return getElementName(
            document.activeElement
        );
    }


    function getElementName(element) {

        if (!element) {
            return "null";
        }

        let result =
            element.tagName;

        if (element.id) {
            result +=
                "#" + element.id;
        }

        if (element.className) {
            result +=
                "." + element.className;
        }

        return result;
    }


    /*
     * 로그 삭제
     */
    function clearLog() {

        logView.textContent = "";

        log("Log cleared");

        updateFocusStatus();
    }


    /*
     * 페이지 로딩 시
     */
    window.addEventListener(
        "load",
        function () {

            log("Page loaded");

            log(
                "User Agent : "
                + navigator.userAgent
            );

            log(
                "Initial activeElement : "
                + getActiveElementName()
            );

            updateFocusStatus();
        }
    );

</script>

</body>
</html>
